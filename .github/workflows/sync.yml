name: Sync Garmin running data

on:
  schedule:
    # Corre domingo 9:00pm hora Panamá (UTC-5) = lunes 02:00 UTC.
    # Cron es en UTC siempre, no en tu zona horaria local.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}   # te permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write   # necesario para poder hacer commit del archivo de datos

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install garminconnect

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python garmin_sync.py

      - name: Commit updated data
        run: |
          git config user.name "garmin-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/activities.json data/activities.csv data/last_sync.json
          git diff --cached --quiet && echo "Sin cambios nuevos" || git commit -m "chore: sync Garmin data $(date -u +%Y-%m-%d)"
          git push
